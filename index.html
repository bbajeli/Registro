<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Registro pagamenti</title>
<style>
:root{--ink:#1F2A33;--mute:#66747F;--paper:#F2F5F6;--card:#fff;--line:#DCE3E7;--sage:#4F8574;--sage-d:#3C6A5B;--sky:#E1ECF1;--amber:#B9772B;--red:#B04A3F}
@media(prefers-color-scheme:dark){:root{--ink:#E8EEF1;--mute:#93A1AB;--paper:#161D23;--card:#1F2830;--line:#2E3a44;--sage:#6FA896;--sage-d:#8CC0AE;--sky:#25343E;--amber:#D9A05A;--red:#E0786C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:15px;font-weight:600;margin:4px 2px 12px;color:var(--mute)}
.seg{display:flex;background:var(--sky);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}
.nav button{border:0;background:none;font-size:26px;color:var(--sage-d);padding:2px 14px}
.nav span{font-weight:600;text-transform:capitalize}
.total{text-align:center;padding:6px 0 4px}
.total b{display:block;font:600 46px/1.1 ui-serif,Georgia,serif;letter-spacing:-.5px}
.total small{color:var(--mute)}
.split{display:flex;gap:8px;margin:12px 0}
.split div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.split small{display:block;color:var(--mute);font-size:13px}
.split b{font-size:18px}
.filters{display:flex;gap:8px;margin-bottom:6px}
.filters select{flex:1}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
h2{font-size:14px;font-weight:600;color:var(--mute);margin:20px 2px 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;font:inherit;color:inherit;text-align:left}
.row:last-child{border-bottom:0}
.row.sel{background:var(--sky)}
.row .n{flex:1;min-width:0}
.row .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n small{color:var(--mute)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums}
.unpaid{color:var(--amber)}
.empty{padding:22px 14px;text-align:center;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.main{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.ghost{background:none;border:0;color:var(--sage-d);padding:10px;flex:none}
.btn.del{color:var(--red);flex:none}
.foot{text-align:center;margin-top:18px}
dialog{width:min(92vw,460px);border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{margin:0;flex:1}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chips input:checked+span{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.chips input:focus-visible+span,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.acts{display:flex;gap:8px;margin-top:18px;align-items:center}
.acts .btn{padding:12px}
.hide{display:none!important}
.plist .row{padding:9px 4px}
.add{display:flex;gap:8px}
.add .btn{flex:none;padding:10px 16px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Registro pagamenti</h1>
  <div class="seg" id="per">
    <button data-p="day">Giorno</button><button data-p="week">Settimana</button><button data-p="month" class="on">Mese</button><button data-p="year">Anno</button>
  </div>
  <div class="nav"><button id="prev" aria-label="Precedente">‹</button><span id="lab"></span><button id="next" aria-label="Successivo">›</button></div>
  <div class="total"><b id="tot">0 €</b><small id="cnt"></small></div>
  <div class="split">
    <div><small>Bonifico</small><b id="tb">0 €</b></div>
    <div><small>Contanti</small><b id="tc">0 €</b></div>
    <div><small>Non pagati</small><b id="tu" class="unpaid">0</b></div>
  </div>
  <div class="filters">
    <select id="ft" aria-label="Tipo pagamento"><option value="">Tutti i pagamenti</option><option>Bonifico</option><option>Contanti</option></select>
    <select id="fp" aria-label="Paziente"></select>
  </div>
  <h2>Per paziente</h2>
  <div class="list" id="byp"></div>
  <h2>Appuntamenti</h2>
  <div class="list" id="apps"></div>
  <div class="foot"><button class="btn ghost" id="exp">Esporta CSV</button><button class="btn ghost" id="imp">Importa CSV</button><input type="file" id="impF" accept=".csv,text/csv,text/plain" class="hide"></div>
</main>

<div class="bar"><div>
  <button class="btn" id="addP">+ Paziente</button>
  <button class="btn main" id="addA">+ Appuntamento</button>
</div></div>
<div id="toast"></div>

<dialog id="dA">
  <form method="dialog" id="fA">
    <h3 id="tA">Nuovo appuntamento</h3>
    <label for="aD">Data e ora</label>
    <input type="datetime-local" id="aD" required>
    <label for="aP">Paziente</label>
    <select id="aP" required></select>
    <label>Importo</label>
    <div class="chips" id="aI">
      <label><input type="radio" name="imp" value="0"><span>Non pagato</span></label>
      <label><input type="radio" name="imp" value="50" checked><span>50 €</span></label>
      <label><input type="radio" name="imp" value="60"><span>60 €</span></label>
      <label><input type="radio" name="imp" value="x"><span>Altro</span></label>
    </div>
    <input type="number" id="aC" class="hide" inputmode="decimal" min="0.01" step="0.01" placeholder="Importo in €" style="margin-top:8px">
    <div id="aTw">
      <label>Tipo pagamento</label>
      <div class="chips" id="aT">
        <label><input type="radio" name="tp" value="Bonifico" checked><span>Bonifico</span></label>
        <label><input type="radio" name="tp" value="Contanti"><span>Contanti</span></label>
      </div>
    </div>
    <div class="acts">
      <button type="button" class="btn del hide" id="aDel">Elimina</button>
      <button type="button" class="btn" id="aX">Annulla</button>
      <button class="btn main" id="aS">Salva</button>
    </div>
  </form>
</dialog>

<dialog id="dP">
  <h3>Pazienti</h3>
  <form class="add" id="fP"><input id="pN" placeholder="Nome e cognome" autocomplete="off" required><button class="btn main">Aggiungi</button></form>
  <div class="plist" id="pL"></div>
  <div class="acts"><button type="button" class="btn" id="pX">Chiudi</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s),KEY='registro-pagamenti-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{patients:[],appts:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Salvataggio non riuscito')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:n%1?2:0}).format(n);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=id=>(db.patients.find(p=>p.id===id)||{name:'(eliminato)'}).name;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

let per='month',ref=new Date(),fType='',fPat='';
function range(){
  const d=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate());
  if(per==='day')return[ymd(d),ymd(d),d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})];
  if(per==='week'){const off=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-off);const b=new Date(a);b.setDate(a.getDate()+6);
    const f=x=>x.toLocaleDateString('it-IT',{day:'numeric',month:'short'});return[ymd(a),ymd(b),f(a)+' – '+f(b)+' '+b.getFullYear()]}
  if(per==='month')return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),d.toLocaleDateString('it-IT',{month:'long',year:'numeric'})];
  return[d.getFullYear()+'-01-01',d.getFullYear()+'-12-31',String(d.getFullYear())];
}
function shift(n){
  if(per==='day')ref.setDate(ref.getDate()+n);
  else if(per==='week')ref.setDate(ref.getDate()+7*n);
  else if(per==='month')ref=new Date(ref.getFullYear(),ref.getMonth()+n,1);
  else ref=new Date(ref.getFullYear()+n,0,1);
  render();
}

function render(){
  const[a,b,label]=range();$('#lab').textContent=label;
  document.querySelectorAll('#per button').forEach(x=>x.classList.toggle('on',x.dataset.p===per));
  const inP=db.appts.filter(x=>{const d=x.dt.slice(0,10);return d>=a&&d<=b});
  const byType=inP.filter(x=>!fType||x.type===fType||(!x.amount&&false));
  // elenco paziente (ignora filtro paziente)
  const pat={};byType.forEach(x=>{(pat[x.pid]=pat[x.pid]||{n:0,t:0});pat[x.pid].n++;pat[x.pid].t+=x.amount});
  const rows=byType.filter(x=>!fPat||x.pid===fPat).sort((x,y)=>y.dt.localeCompare(x.dt));
  const paid=rows.filter(x=>x.amount>0);
  const sum=l=>l.reduce((s,x)=>s+x.amount,0);
  $('#tot').textContent=eur(sum(rows));
  $('#cnt').textContent=rows.length+(rows.length===1?' appuntamento':' appuntamenti');
  $('#tb').textContent=eur(sum(paid.filter(x=>x.type==='Bonifico')));
  $('#tc').textContent=eur(sum(paid.filter(x=>x.type==='Contanti')));
  $('#tu').textContent=rows.filter(x=>!x.amount).length;
  // select filtro paziente
  const opts='<option value="">Tutti i pazienti</option>'+db.patients.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if($('#fp').dataset.k!==opts){$('#fp').innerHTML=opts;$('#fp').dataset.k=opts}
  $('#fp').value=fPat;
  // per paziente
  const pk=Object.keys(pat).sort((x,y)=>pat[y].t-pat[x].t);
  $('#byp').innerHTML=pk.length?pk.map(id=>`<button class="row${fPat===id?' sel':''}" data-id="${id}"><div class="n"><div>${esc(pname(id))}</div><small>${pat[id].n} app.</small></div><div class="v">${eur(pat[id].t)}</div></button>`).join(''):'<div class="empty">Nessun dato in questo periodo</div>';
  // appuntamenti
  $('#apps').innerHTML=rows.length?rows.map(x=>{const d=new Date(x.dt);
    return`<button class="row" data-id="${x.id}"><div class="n"><div>${esc(pname(x.pid))}</div><small>${d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} · ${x.dt.slice(11,16)}${x.amount?' · '+x.type:''}</small></div><div class="v${x.amount?'':' unpaid'}">${x.amount?eur(x.amount):'Non pagato'}</div></button>`}).join(''):'<div class="empty">Nessun appuntamento</div>';
}

// periodo / filtri
$('#per').onclick=e=>{const p=e.target.dataset.p;if(p){per=p;render()}};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#ft').onchange=e=>{fType=e.target.value;render()};
$('#fp').onchange=e=>{fPat=e.target.value;render()};
$('#byp').onclick=e=>{const r=e.target.closest('.row');if(r){fPat=fPat===r.dataset.id?'':r.dataset.id;render()}};
$('#lab').onclick=()=>{ref=new Date();render()};

// appuntamento
let editId=null;
function setImp(v){document.querySelectorAll('input[name=imp]').forEach(r=>r.checked=r.value===v);syncImp()}
function syncImp(){const v=document.querySelector('input[name=imp]:checked').value;
  $('#aC').classList.toggle('hide',v!=='x');$('#aC').required=v==='x';$('#aTw').classList.toggle('hide',v==='0')}
$('#aI').onchange=syncImp;
function openA(id){
  if(!db.patients.length){toast('Aggiungi prima un paziente');openP();return}
  editId=id||null;const x=db.appts.find(a=>a.id===id);
  $('#tA').textContent=x?'Modifica appuntamento':'Nuovo appuntamento';
  $('#aP').innerHTML=db.patients.slice().sort((p,q)=>p.name.localeCompare(q.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#aD').value=x?x.dt:nowLocal();
  $('#aP').value=x?x.pid:(fPat||db.appts.length&&db.appts[db.appts.length-1].pid||$('#aP').options[0].value);
  const std=x&&[0,50,60].includes(x.amount)?String(x.amount):(x?'x':'50');
  setImp(std);$('#aC').value=x&&std==='x'?x.amount:'';
  document.querySelectorAll('input[name=tp]').forEach(r=>r.checked=r.value===((x&&x.type)||'Bonifico'));
  $('#aDel').classList.toggle('hide',!x);
  $('#dA').showModal();
}
$('#addA').onclick=()=>openA();
$('#aX').onclick=()=>$('#dA').close();
$('#apps').onclick=e=>{const r=e.target.closest('.row');if(r)openA(r.dataset.id)};
$('#fA').onsubmit=e=>{
  const v=document.querySelector('input[name=imp]:checked').value;
  const amount=v==='x'?Math.round(parseFloat($('#aC').value.replace(',','.'))*100)/100:+v;
  if(!(amount>=0)||isNaN(amount)){e.preventDefault();return}
  const rec={id:editId||uid(),dt:$('#aD').value,pid:$('#aP').value,amount,type:amount?document.querySelector('input[name=tp]:checked').value:''};
  if(editId)db.appts=db.appts.map(a=>a.id===editId?rec:a);else db.appts.push(rec);
  save();ref=new Date(rec.dt);render();toast('Appuntamento salvato');
};
$('#aDel').onclick=()=>{if(confirm('Eliminare questo appuntamento?')){db.appts=db.appts.filter(a=>a.id!==editId);save();render();$('#dA').close()}};

// pazienti
function openP(){listP();$('#dP').showModal()}
function listP(){$('#pL').innerHTML=db.patients.length?db.patients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="row"><div class="n"><div>${esc(p.name)}</div></div><button class="btn ghost btn del" data-id="${p.id}">Elimina</button></div>`).join(''):'<div class="empty">Nessun paziente</div>'}
$('#addP').onclick=openP;$('#pX').onclick=()=>$('#dP').close();
$('#fP').onsubmit=e=>{e.preventDefault();const n=$('#pN').value.trim();if(!n)return;
  db.patients.push({id:uid(),name:n});save();$('#pN').value='';listP();render();toast('Paziente aggiunto')};
$('#pL').onclick=e=>{const id=e.target.dataset.id;if(!id)return;
  if(db.appts.some(a=>a.pid===id)){alert('Questo paziente ha degli appuntamenti registrati: non può essere eliminato.');return}
  if(confirm('Eliminare il paziente?')){db.patients=db.patients.filter(p=>p.id!==id);if(fPat===id)fPat='';save();listP();render()}};

// CSV
$('#exp').onclick=async()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[['Data','Ora','Paziente','Tipo pagamento','Importo (€)','Stato'].join(';')];
  db.appts.slice().sort((a,b)=>a.dt.localeCompare(b.dt)).forEach(x=>lines.push([x.dt.slice(0,10),x.dt.slice(11,16),q(pname(x.pid)),x.type||'',String(x.amount).replace('.',','),x.amount?'Pagato':'Non pagato'].join(';')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'});
  const f=new File([blob],'pagamenti-'+ymd(new Date())+'.csv',{type:'text/csv'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
};

// Import CSV (stesso formato dell'export; unisce ai dati esistenti senza duplicare)
function parseCSV(t){t=t.replace(/^\ufeff/,'');const d=(t.split(/\r?\n/)[0]||'').includes(';')?';':',';
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))out.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x!==''))out.push(row);return out}
$('#imp').onclick=()=>{$('#impF').value='';$('#impF').click()};
$('#impF').onchange=async e=>{const file=e.target.files[0];if(!file)return;
  const rows=parseCSV(await file.text());
  if(!rows.length||!/data/i.test(rows[0][0]||'')||rows[0].length<5){alert('File non riconosciuto: usa un CSV esportato da questa app.');return}
  let add=0,dup=0,bad=0,newP=0;const nd={patients:db.patients.map(p=>({...p})),appts:db.appts.slice()};
  for(const r of rows.slice(1)){
    const date=(r[0]||'').trim(),time=(r[1]||'').trim(),name=(r[2]||'').trim(),type=(r[3]||'').trim();
    const amount=Math.round(parseFloat((r[4]||'').replace(',','.'))*100)/100;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time)||!name||isNaN(amount)||amount<0||(amount&&!['Bonifico','Contanti'].includes(type))){bad++;continue}
    let pt=nd.patients.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(!pt){pt={id:uid(),name};nd.patients.push(pt);newP++}
    const dt=date+'T'+time,tp=amount?type:'';
    if(nd.appts.some(a=>a.dt===dt&&a.pid===pt.id&&a.amount===amount&&a.type===tp)){dup++;continue}
    nd.appts.push({id:uid(),dt,pid:pt.id,amount,type:tp});add++}
  if(!confirm('Importare '+add+' appuntamenti'+(newP?' e '+newP+' nuovi pazienti':'')+'?\nGià presenti (ignorati): '+dup+(bad?'\nRighe non valide (ignorate): '+bad:'')))return;
  db=nd;save();render();toast('Import completato')};

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
